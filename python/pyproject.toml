[project]
name = "tutor-speech"
version = "0.0.0"
description = "MLX speech gateway for tutor: Whisper-turbo ASR + VoxCPM2 TTS + Qwen3-ForcedAligner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-audio",
  "mlx",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "numpy>=1.26",
  "soundfile>=0.12",
  "huggingface_hub>=0.26",
  # The Qwen3 forced aligner needs nagisa to split Japanese text into words
  # (`tokenize_japanese`). Without it every Japanese "Say it" attempt 500s.
  "nagisa>=0.3.2",
  # Same deal for Korean: the aligner's `tokenize_korean` imports soynlp.
  "soynlp>=0.0.493",
  # Whisper can emit Simplified Mandarin; zhconv realigns a transcript to a
  # Traditional deck's script so pronunciation scoring is not scuttled by it.
  "zhconv>=1.4.3",
]

[tool.uv]
package = false
